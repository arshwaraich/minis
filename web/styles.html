<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minis · style board</title>
<script type="importmap">{ "imports": { "three": "./vendor/three/three.webgpu.min.js", "three/webgpu": "./vendor/three/three.webgpu.min.js", "three/tsl": "./vendor/three/three.tsl.min.js", "three/addons/": "./vendor/three/addons/" } }</script>
<style>
  body { margin: 0; background: #f3efe6; font: 14px/1.3 ui-rounded, system-ui, sans-serif; color: #2b2a33; }
  header { padding: 14px 16px 2px; display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 20px; } h2 { margin: 18px 16px 6px; font-size: 16px; } a { color: inherit; font-weight: 700; }
  .note { color: #77727f; font-size: 12px; margin: 0 16px; }
  .grid { display: grid; grid-template-columns: repeat(5, minmax(150px, 1fr)); gap: 8px; padding: 8px 16px; overflow-x: auto; }
  .grid.heads { grid-template-columns: repeat(5, minmax(150px, 1fr)); }
  .cell { background: #fffdf9; border-radius: 16px; padding: 6px; text-align: center; }
  .cell img { width: 100%; display: block; border-radius: 12px; aspect-ratio: 5 / 7; object-fit: contain; background: #fffdf9; }
  .heads .cell img { aspect-ratio: 1; }
  .cap { font-weight: 800; font-size: 12px; margin-top: 4px; } .cap span { font-weight: 600; color: #8a8494; }
  .colhead { font-weight: 800; text-align: center; padding: 4px; }
  .ref .cap { color: #b0503c; }
</style>
<header><h1>Style board</h1><a href="./">← island</a> <a href="compare.html">photos side by side</a></header>
<p class="note">Left column: reference art for visual comparison — Animal Crossing: New Horizons player artwork © Nintendo (via Nookipedia). Other columns: our four original style presets, same person per row.</p>
<h2>Full body</h2>
<div class="grid" id="full"></div>
<h2>Heads</h2>
<div class="grid heads" id="heads"></div>
<script type="module">
import * as THREE from 'three';
import { traitsToParams, buildAvatar, STYLES } from './avatar.js';
const list = await (await fetch('people.json')).json();
const names = (new URLSearchParams(location.search).get('only') || 'Sam,Tom,Lucía,Andrés,Clara').split(',');
const people = names.map((n) => list.find((p) => p.name === n)).filter(Boolean);
const refs = ['ref1', 'ref5', 'ref2', 'ref9', 'ref10', 'ref4'];
const styles = Object.keys(STYLES);

const renderer = new THREE.WebGPURenderer({ antialias: true, alpha: true, forceWebGL: true });
await renderer.init();
renderer.setPixelRatio(2);
renderer.toneMapping = THREE.NoToneMapping;
const scene = new THREE.Scene();
scene.background = new THREE.Color('#fffdf9');
const cam = new THREE.PerspectiveCamera(22, 1, 0.1, 80);
const box = new THREE.Box3(), c = new THREE.Vector3(), sz = new THREE.Vector3();

function shot(P, style, mode) {
  const av = buildAvatar({ ...P, style });
  if (mode === 'full') { av.wave(); av.update(0.33, 0.016, {}); } else av.update(0, 0.016, {});
  av.root.rotation.y = mode === 'full' ? -0.3 : -0.12;
  scene.add(av.root);
  av.root.updateMatrixWorld(true);
  box.setFromObject(av.root); box.getCenter(c); box.getSize(sz);
  const [w, h] = mode === 'full' ? [250, 350] : [260, 260];
  renderer.setSize(w, h);
  cam.aspect = w / h; cam.updateProjectionMatrix();
  const fov = THREE.MathUtils.degToRad(cam.fov);
  if (mode === 'full') {
    // frame feet to head-top (ignores any stray bounds)
    const top = av.root.userData.headTopY, mid = top / 2;
    const hfov = 2 * Math.atan(Math.tan(fov / 2) * cam.aspect);
    const dist = Math.max((top * 1.15) / 2 / Math.tan(fov / 2), 2.4 / 2 / Math.tan(hfov / 2)) + 1;
    cam.position.set(0, mid + top * 0.05, dist); cam.lookAt(0, mid, 0);
  } else {
    const hy = av.root.userData.headCenterY, span = 2.6;
    const dist = span / 2 / Math.tan(fov / 2);
    cam.position.set(0, hy + 0.15, dist); cam.lookAt(0, hy - 0.05, 0);
  }
  renderer.render(scene, cam);
  scene.remove(av.root);
  return renderer.domElement.toDataURL();
}
const cell = (src, cap, cls = '') => {
  const d = document.createElement('div'); d.className = 'cell ' + cls;
  d.innerHTML = `<img alt=""><div class="cap"></div>`;
  d.querySelector('img').src = src; d.querySelector('.cap').innerHTML = cap; return d;
};
for (const id of ['full', 'heads']) {
  const g = document.getElementById(id);
  for (const h of ['Reference', ...styles.map((s) => STYLES[s].label)]) g.append(Object.assign(document.createElement('div'), { className: 'colhead', textContent: h }));
}
people.forEach((p, i) => {
  const P = traitsToParams(p.traits || {}, p.name);
  document.getElementById('full').append(cell(`ref/${refs[i % refs.length]}.png`, 'reference', 'ref'));
  for (const s of styles) document.getElementById('full').append(cell(shot(P, s, 'full'), `${STYLES[s].label} <span>· ${p.name}</span>`));
  document.getElementById('heads').append(cell(p.image, `photo <span>· ${p.name}</span>`));
  for (const s of styles) document.getElementById('heads').append(cell(shot(P, s, 'head'), STYLES[s].label));
});
document.body.classList.add('ready');
</script>
</html>
