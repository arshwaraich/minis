<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minis · side by side</title>
<script type="importmap">{ "imports": { "three": "./vendor/three/three.webgpu.min.js", "three/webgpu": "./vendor/three/three.webgpu.min.js", "three/tsl": "./vendor/three/three.tsl.min.js" } }</script>
<style>
  body { margin: 0; background: linear-gradient(#9fdcf5, #e9f7f2) fixed; font: 14px/1.3 ui-rounded, system-ui, sans-serif; color: #2b2a33; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 16px 4px; }
  h1 { margin: 0; font-size: 20px; } a { color: inherit; font-weight: 700; }
  #g { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; padding: 12px 16px 24px; }
  .pair { background: #fffdf8; border-radius: 20px; padding: 10px; box-shadow: 0 4px 0 rgba(0,0,0,.06); }
  .imgs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .imgs img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 14px; display: block; background: #e9f4f8; }
  .name { font-weight: 800; margin: 8px 4px 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin: 0 2px; }
  body.hero #g { grid-template-columns: repeat(auto-fill, minmax(560px, 1fr)); }
  .chips span { background: #eef6e6; border-radius: 999px; padding: 1px 8px; font-size: 12px; font-weight: 600; }
</style>
<header><h1>Side by side</h1><a href="./">← island</a></header>
<div id="g"></div>
<script type="module">
import * as THREE from 'three';
import { traitsToParams, buildAvatar } from './avatar.js';
import { traitLabels } from './labels.js';
const list = await (await fetch(new URLSearchParams(location.search).get('src') || 'people.json')).json();
const renderer = new THREE.WebGPURenderer({ antialias: true, alpha: true, forceWebGL: true });
await renderer.init();
const QS = new URLSearchParams(location.search);
const S = +(QS.get('size') || 520);
if (QS.get('only')) document.body.classList.add('hero');
renderer.setSize(S, S);
renderer.toneMapping = THREE.NoToneMapping;
const scene = new THREE.Scene();
scene.background = new THREE.Color('#e3f2f6');
scene.add(new THREE.HemisphereLight('#fffdf5', '#f3dcc0', 2.0));
const sun = new THREE.DirectionalLight('#fff1dc', 1.5); sun.position.set(3, 6, 6); scene.add(sun);
// frame head + shoulders like a portrait photo
const cam = new THREE.PerspectiveCamera(24, 1, 0.1, 50);
const only = QS.get('only') ? QS.get('only').split(',') : null;
for (const p of (Array.isArray(list) ? list : list.people).filter((p) => !only || only.includes(p.name))) {
  const P = { ...traitsToParams(p.traits || {}, p.name), ...(p.override || {}) };
  const av = buildAvatar(P);
  av.update(0, 0.016, {});
  scene.add(av.root);
  av.root.updateMatrixWorld(true);
  const headY = av.root.userData.headCenterY;
  cam.position.set(0, headY + 0.15, 6.6);
  cam.lookAt(0, headY - 0.05, 0);
  renderer.render(scene, cam);
  scene.remove(av.root);
  const card = document.createElement('div');
  card.className = 'pair';
  card.id = encodeURIComponent(p.name);
  card.innerHTML = `<div class="imgs"><img alt="photo"><img alt="avatar"></div><div class="name"></div><div class="chips"></div>`;
  const [ph, avi] = card.querySelectorAll('img');
  ph.src = p.image; avi.src = renderer.domElement.toDataURL();
  card.querySelector('.name').textContent = p.name;
  card.querySelector('.chips').innerHTML = traitLabels(P).map((t) => `<span>${t}</span>`).join('');
  document.querySelector('#g').append(card);
}
document.body.classList.add('ready');
if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
</script>
</html>
