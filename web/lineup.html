<!doctype html>
<!-- Dev page: each avatar above its source photo, for judging likeness. -->
<meta charset="utf-8">
<script type="importmap">{ "imports": { "three": "./vendor/three/three.webgpu.min.js", "three/webgpu": "./vendor/three/three.webgpu.min.js", "three/tsl": "./vendor/three/three.tsl.min.js" } }</script>
<style>body{margin:0;background:#cfe8f3;font:13px system-ui} #g{display:grid;grid-template-columns:repeat(6,200px);gap:6px;padding:6px} .c{background:#fff;border-radius:10px;overflow:hidden;text-align:center} .c img{width:200px;height:200px;object-fit:cover;display:block} .c canvas{display:block}</style>
<div id="g"></div>
<script type="module">
import * as THREE from 'three';
import { traitsToParams, buildAvatar } from './avatar.js';
const list = await (await fetch('people.json')).json();
const renderer = new THREE.WebGPURenderer({ antialias: true, forceWebGL: true });
await renderer.init();
renderer.setSize(200, 240);
renderer.toneMapping = THREE.NeutralToneMapping;
const view = new URLSearchParams(location.search).get('view') || 'front';
for (const p of list) {
  const scene = new THREE.Scene();
  scene.background = new THREE.Color('#e9f4f8');
  scene.add(new THREE.HemisphereLight('#fffdf5', '#f3dcc0', 2.0));
  const sun = new THREE.DirectionalLight('#fff1dc', 1.5); sun.position.set(3, 6, 6); scene.add(sun);
  const P = traitsToParams(p.traits, p.name);
  const av = buildAvatar(P);
  av.update(0, 0.016, {});
  scene.add(av.root);
  const cam = new THREE.PerspectiveCamera(26, 200 / 240, 0.1, 50);
  const top = view === 'head';
  if (view === 'side') cam.position.set(6.5, 2, 2); else if (top) cam.position.set(0, 1.95, 5.2); else cam.position.set(0, 1.6, 8.8);
  cam.lookAt(0, top ? 1.85 : 1.45, 0);
  renderer.render(scene, cam);
  const c = document.createElement('div'); c.className = 'c';
  const img = new Image(); img.src = renderer.domElement.toDataURL();
  const ph = new Image(); ph.src = p.image;
  c.append(img, ph, Object.assign(document.createElement('div'), { textContent: p.name }));
  document.querySelector('#g').append(c);
}
document.body.classList.add('ready');
</script>
